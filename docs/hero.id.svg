<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
<title id="title">Debian + Hermes Agent Railway</title>
<desc id="desc">Original dark terminal illustration showing Debian 13, Hermes Agent CLI, messaging channels, and a persistent workspace.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#141823"/><stop offset="1" stop-color="#28283a"/></linearGradient>
 <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fb7185"/><stop offset="1" stop-color="#a80030"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6c968"/><stop offset="1" stop-color="#b7791f"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#05070d" flood-opacity=".4"/></filter>
</defs>
<rect width="1200" height="450" rx="26" fill="url(#bg)"/>
<circle cx="1040" cy="45" r="180" fill="#a80030" opacity=".12"/><circle cx="1120" cy="390" r="230" fill="#cc8b28" opacity=".07"/>
<path d="M0 352 C210 300 315 455 510 402 S890 330 1200 360 V450 H0Z" fill="#090c13" opacity=".35"/>
<g transform="translate(45 48)" filter="url(#shadow)">
 <rect width="700" height="350" rx="18" fill="#0a0d14" stroke="#454d60" stroke-width="2"/>
 <path d="M18 0 H682 Q700 0 700 18 V55 H0 V18 Q0 0 18 0Z" fill="#292f40"/>
 <circle cx="28" cy="28" r="6" fill="#f87171"/><circle cx="50" cy="28" r="6" fill="#fbbf24"/><circle cx="72" cy="28" r="6" fill="#34d399"/>
 <text x="350" y="33" fill="#c7ceda" font-family="ui-monospace,Consolas,monospace" font-size="13" text-anchor="middle">debian-hermes-railway · bash</text>
 <text x="30" y="95" fill="#fda4af" font-family="ui-monospace,Consolas,monospace" font-size="15">root@railway-container:/data</text>
 <text x="30" y="128" fill="#e4e8f0" font-family="ui-monospace,Consolas,monospace" font-size="15">OS:       Debian GNU/Linux 13 (trixie)</text>
 <text x="30" y="157" fill="#e4e8f0" font-family="ui-monospace,Consolas,monospace" font-size="15">Agent:    Hermes CLI installed</text>
 <text x="30" y="186" fill="#e4e8f0" font-family="ui-monospace,Consolas,monospace" font-size="15">Gateway:  Telegram / Discord ready</text>
 <text x="30" y="215" fill="#e4e8f0" font-family="ui-monospace,Consolas,monospace" font-size="15">State:    /opt/data  ·  Volume</text>
 <text x="30" y="267" fill="#fcd34d" font-family="ui-monospace,Consolas,monospace" font-size="15">$ hermes status</text>
 <text x="30" y="296" fill="#86efac" font-family="ui-monospace,Consolas,monospace" font-size="14">agent configured · terminal online</text>
 <rect x="30" y="314" width="9" height="17" rx="2" fill="#fb7185"/>
</g>
<g transform="translate(800 82)" font-family="Inter,Segoe UI,sans-serif">
 <rect width="350" height="285" rx="22" fill="#1b2030" stroke="#424a5d" stroke-width="1.5"/>
 <text x="175" y="43" text-anchor="middle" fill="#fff" font-size="16" font-weight="700" letter-spacing="2">CONNECTED WORKFLOW</text>
 <rect x="30" y="69" width="125" height="60" rx="12" fill="#252d3d" stroke="#d3a64e"/>
 <text x="92" y="94" text-anchor="middle" fill="#f8d98e" font-size="14" font-weight="700">HERMES</text><text x="92" y="113" text-anchor="middle" fill="#d3d9e5" font-size="12">Agent CLI</text>
 <path d="M155 99 H195" stroke="#9ba5b7" stroke-width="2.5"/><path d="M188 92 L197 99 L188 106" fill="none" stroke="#9ba5b7" stroke-width="2.5"/>
 <rect x="202" y="69" width="118" height="60" rx="12" fill="#292339" stroke="#b69af2"/>
 <text x="261" y="94" text-anchor="middle" fill="#d9c9ff" font-size="14" font-weight="700">GATEWAY</text><text x="261" y="113" text-anchor="middle" fill="#d3d9e5" font-size="12">Auto-start</text>
 <path d="M261 129 V155 H92 V176 M261 155 V176" stroke="#8792a5" stroke-width="2.2" fill="none"/>
 <rect x="30" y="176" width="125" height="48" rx="10" fill="#193a35" stroke="#38b2ac"/>
 <text x="92" y="206" text-anchor="middle" fill="#9ee8dc" font-size="15" font-weight="700">Telegram</text>
 <rect x="202" y="176" width="118" height="48" rx="10" fill="#252d4a" stroke="#849cff"/>
 <text x="261" y="206" text-anchor="middle" fill="#c6d1ff" font-size="15" font-weight="700">Discord</text>
 <path d="M30 245 H320" stroke="#414a5b"/>
 <text x="175" y="266" text-anchor="middle" fill="#b9c2d2" font-size="13">Debian 13 · Docker · Railway</text>
