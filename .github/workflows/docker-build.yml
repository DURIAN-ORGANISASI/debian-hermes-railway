name: Docker build, runtime validation, and security scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke-test:
    name: Build and test (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    env:
      TERMINAL_USER: railway-ci-test
      TERMINAL_PASSWORD: ci-only-smoke-test-Password-2026
      IMAGE_TAG: debian-hermes-railway-ci:${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Check shell and Python syntax
        run: |
          set -Eeuo pipefail
          bash -n entrypoint.sh
          bash -n start-hermes
          bash -n system-banner.sh
          python3 -m py_compile service-supervisor.py
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Build the Debian Hermes image
        run: docker buildx build --pull --platform "${{ matrix.platform }}" --load --tag "$IMAGE_TAG" .
      - name: Verify terminal, non-root runtime, and Volume persistence
        shell: bash
        run: |
          set -Eeuo pipefail
          container_name="debian-hermes-railway-smoke"
          volume_name="debian-hermes-railway-persist-test"
          cleanup() {
            docker rm -f "$container_name" >/dev/null 2>&1 || true
            docker volume rm "$volume_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker volume create "$volume_name" >/dev/null
          docker run --rm --entrypoint /bin/bash --volume "$volume_name:/seed" "$IMAGE_TAG" -ec '
            printf "%s\n" "legacy-volume-data" > /seed/.ci-legacy-root-file
            chown 0:0 /seed/.ci-legacy-root-file
          '
          start_container() {
            docker run --detach --name "$container_name" --publish 127.0.0.1::8080 \
              --volume "$volume_name:/opt/data" --env TERMINAL_USER --env TERMINAL_PASSWORD \
              --env PORT=8080 --env HERMES_AUTOSTART=false "$IMAGE_TAG" >/dev/null
          }
          wait_for_terminal() {
            local host_port status
            host_port="$(docker port "$container_name" 8080/tcp | sed 's/.*://')"
            for attempt in $(seq 1 60); do
              status="$(curl --silent --output /tmp/ttyd-authorized.html --write-out '%{http_code}' \
                --user "${TERMINAL_USER}:${TERMINAL_PASSWORD}" "http://127.0.0.1:${host_port}/" 2>/dev/null || true)"
              [[ "$status" == "200" ]] && break
              sleep 2
            done
            if [[ "${status:-}" != "200" ]] || [[ ! -s /tmp/ttyd-authorized.html ]] || ! grep -qi "ttyd" /tmp/ttyd-authorized.html; then
              echo "ERROR: authenticated terminal smoke test failed."
              docker logs "$container_name" 2>&1 || true
              exit 1
            fi
            local unauthorized_code
            unauthorized_code="$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:${host_port}/" 2>/dev/null || true)"
            [[ "$unauthorized_code" == "401" ]] || { echo "ERROR: anonymous access returned HTTP $unauthorized_code."; exit 1; }
          }
          start_container
          wait_for_terminal
          process_uid="$(docker exec "$container_name" awk '/^Uid:/ {print $2}' /proc/1/status)"
          [[ "$process_uid" == "10001" ]] || { echo "ERROR: expected UID 10001, received $process_uid."; exit 1; }
          docker exec --user 10001:10001 "$container_name" sh -ec '
            hermes --version >/dev/null
            test -w /opt/data && test -w /usr/local/share/hermes-tools && test -w /data
            test "$(stat -c %u /opt/data/.ci-legacy-root-file)" = "10001"
            test "$(cat /opt/data/.ci-legacy-root-file)" = "legacy-volume-data"
            printf "%s\n" "persist-across-container-recreate" > /opt/data/.ci-persistence-marker
            touch /data/.ci-write-test /usr/local/share/hermes-tools/.ci-write-test
            rm -f /data/.ci-write-test /usr/local/share/hermes-tools/.ci-write-test
          '
          docker rm --force "$container_name" >/dev/null
          start_container
          wait_for_terminal
          docker exec --user 10001:10001 "$container_name" sh -ec '
            test "$(cat /opt/data/.ci-persistence-marker)" = "persist-across-container-recreate"
          '
          logs="$(docker logs "$container_name" 2>&1 || true)"
          credential_b64="$(printf '%s' "${TERMINAL_USER}:${TERMINAL_PASSWORD}" | base64 | tr -d '\n')"
          if grep -Fq "$TERMINAL_PASSWORD" <<<"$logs" || grep -Fq "$credential_b64" <<<"$logs"; then
            echo "ERROR: terminal logs contain a password or its Base64 encoding."
            exit 1
          fi
          echo "PASS: ${{ matrix.platform }} authentication, UID 10001, root-owned Volume migration, persistence, and credential-safe logs."
      - name: Scan image for HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
